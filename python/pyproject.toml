[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "compilerinfra"
version = "0.6.0"
description = "In-process bindings for CompilerInfra product libraries"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools]
packages = ["compilerinfra"]
