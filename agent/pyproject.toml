[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "compilerinfra-agent"
version = "0.5.3"
description = "Scoped compiler development, source plugins, CLI and MCP for CompilerInfra products"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["compilerinfra==0.5.3", "mcp>=1.12,<2", "pydantic>=2,<3"]

[project.scripts]
compilerinfra-agent = "compilerinfra_agent:main"
compilerinfra-dev = "compilerinfra_agent:cli"

[tool.setuptools]
py-modules = ["compilerinfra_agent"]
packages = ["compilerinfra_dev"]

[tool.setuptools.package-data]
compilerinfra_dev = ["skills/*.md"]
